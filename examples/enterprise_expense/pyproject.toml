[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-enterprise-expense"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = ["agent-runtime>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enterprise_expense = ["schema.sql"]
