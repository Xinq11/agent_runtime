[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "1.0.0"
description = "Internal plug-and-play general Agent Runtime SDK (LangGraph 1.x + PG/pgvector + MinIO OSS + PLG + HTTP/SSE v1)"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_runtime*"]
