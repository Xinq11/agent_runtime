[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "1.0.0"
description = "Internal plug-and-play general Agent Runtime SDK (LangGraph 1.x + PG/pgvector + MinIO OSS + PLG + HTTP/SSE v1)"
requires-python = ">=3.9"
dependencies = [
    "psycopg[binary,pool]>=3.2,<4",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langchain-core>=1,<2",
    "httpx>=0.27,<1",
    "boto3>=1.35,<2",
    "prometheus-client>=0.21,<1",
    "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
]
docs = [
    "pypdf>=4.3,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7.1,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_runtime*"]

[tool.setuptools.package-data]
"agent_runtime.extensions.rag" = ["*.sql"]
"agent_runtime.extensions.skills" = ["*.sql"]
